<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders · __SHOP_NAME__</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0a0a0a; color: #f5f5f5; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 32px; }
  form { display: flex; gap: 8px; margin-bottom: 32px; }
  input { flex: 1; padding: 14px; background: #141414; border: 1px solid #222; border-radius: 10px; color: #fff; font-size: 15px; }
  button { padding: 14px 24px; background: #635BFF; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .order { background: #141414; border: 1px solid #222; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .meta { color: #666; font-size: 13px; margin-bottom: 16px; }
  .item { border-top: 1px solid #222; padding-top: 16px; margin-top: 16px; }
  .item:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }
  .key { font-family: monospace; background: #0a0a0a; border: 1px solid #222; padding: 10px; border-radius: 6px; font-size: 12px; margin: 8px 0; word-break: break-all; }
  a.btn { display: inline-block; padding: 8px 16px; background: #635BFF; color: white; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; margin-right: 8px; }
  .empty { color: #666; text-align: center; padding: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Orders</h1>
  <form id="f">
    <input type="email" id="email" placeholder="your@email.com" required>
    <button type="submit">Look up</button>
  </form>
  <div id="out"></div>
</div>

<script>
const fmt = (cents, cur) => new Intl.NumberFormat('en-US', { style: 'currency', currency: cur.toUpperCase() }).format(cents / 100);

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const out = document.getElementById('out');
  out.textContent = 'Loading…';
  try {
    const r = await fetch('/orders/lookup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await r.json();
    if (!data.orders?.length) { out.innerHTML = '<div class="empty">No orders found for that email.</div>'; return; }
    out.innerHTML = '';
    for (const o of data.orders) {
      const div = document.createElement('div');
      div.className = 'order';
      const date = new Date(o.created_at).toLocaleString();
      let html = '<div class="meta">Order ' + o.order_id + ' · ' + date + ' · ' + fmt(o.amount_total, o.currency) + '</div>';
      for (const it of o.items) {
        html += '<div class="item"><div style="font-weight:600">' + it.product_name + '</div>';
        if (it.license_key) html += '<div class="key">' + it.license_key + '</div>';
        if (it.download_url) html += '<a class="btn" href="' + it.download_url + '">Download</a>';
        if (it.redirect_url) html += '<a class="btn" href="' + it.redirect_url + '" target="_blank">Access</a>';
        html += '</div>';
      }
      div.innerHTML = html;
      out.appendChild(div);
    }
  } catch (err) { out.textContent = 'Error: ' + err.message; }
});
</script>
</body>
</html>
